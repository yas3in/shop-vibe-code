<header class="header">
    <nav class="navbar">
        <div class="nav-right">
            <a href="{% url 'home' %}" class="logo">AirShop</a>
        </div>
        <div class="nav-links">
            <div class="dropdown">
                <a href="#">دسته‌بندی ▾</a>
                <div class="dropdown-content">
                    {% for cat in all_categories %}
                    <a href="{% url 'product_list' %}?category={{ cat.pk }}">{{ cat.name }}</a>
                    {% endfor %}
                </div>
            </div>
            <div class="dropdown">
                <a href="#">برندها ▾</a>
                <div class="dropdown-content">
                    {% for brand in all_brands %}
                    <a href="{% url 'product_list' %}?brand={{ brand.pk }}">{{ brand.name }}</a>
                    {% endfor %}
                </div>
            </div>
            <a href="{% url 'product_list' %}">محصولات</a>
            <a href="{% url 'contact' %}">تماس با ما</a>
        </div>
        <div class="nav-left">
            {% if user.is_authenticated %}
            <a href="{% url 'basket' %}" class="basket-link">🛒 <span class="badge">{{ basket_count }}</span></a>
            <a href="{% url 'order_list' %}">سفارش‌ها</a>
            <a href="{% url 'catalog_panel:dashboard' %}">پنل</a>
            <a href="{% url 'logout' %}">خروج</a>
            {% else %}
            <a href="{% url 'login' %}">ورود</a>
            <a href="{% url 'register' %}">ثبت‌نام</a>
            {% endif %}
        </div>
    </nav>
</header>
